services:
  # Backend Hono — server/index.ts descubre y monta cada src/api/*.ts.
  - type: web
    name: hub-sapience-api
    runtime: node
    region: virginia # más cercano a Supabase (ca-central-1) — Render no tiene región en Canadá
    # Sin rootDir: los comandos corren desde la raíz del repo. server/ es
    # HERMANO de src/, no ancestro — desde src/api/*.ts, Node resuelve
    # node_modules subiendo (src/api → src/ → raíz), nunca bajando a
    # server/node_modules. Cada endpoint importa `zod` directo, así que sin el
    # `npm install` de la raíz (que sí tiene zod/openai/@supabase-js), TODOS
    # los endpoints fallan al montar — no es un problema de rutas, es que su
    # node_modules real nunca se instaló. `cd server && npm install` cubre las
    # dependencias propias del server (pg, hono, etc.), que sí resuelven bien
    # porque compat/*.ts vive dentro de server/.
    # `npx puppeteer browsers install chrome` es idempotente (no-op si ya
    # está) — sin esto, un deploy donde Render reutiliza el node_modules
    # cacheado puede saltarse el postinstall que descarga Chrome, y
    # generatePoPdf.ts vuelve a tronar con "Could not find Chrome" aunque
    # PUPPETEER_CACHE_DIR (abajo) esté bien configurada.
    buildCommand: npm install && npx puppeteer browsers install chrome && cd server && npm install
    startCommand: cd server && npm start
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false
      # Tope de conexiones del pool de este proceso contra el pool_size:15 de
      # Supavisor en modo sesión (aws-0-ca-central-1.pooler.supabase.com:5432).
      # 6 deja margen para que un rolling deploy solape 2 instancias (6×2=12)
      # sin acercarse al límite, más scripts de server/scripts/ o el dashboard.
      - key: PG_POOL_MAX
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: MS_TENANT_ID
        sync: false
      - key: MS_CLIENT_ID
        sync: false
      - key: MS_CLIENT_SECRET
        sync: false
      - key: MS_SEND_AS_EMAIL
        sync: false
      - key: MS_CALENDAR_EMAIL
        sync: false
      # URL pública del front ya desplegado — también sirve como origen permitido de CORS (ver server/index.ts)
      - key: ZITE_APP_URL
        sync: false
      - key: ZITE_ABLY_API_KEY
        sync: false
      - key: ZITE_FILLOUT_API_KEY
        sync: false
      - key: ZITE_GOOGLE_MAPS_API_KEY
        sync: false
      - key: ZITE_OPENAI_ACCESS_TOKEN
        sync: false
      - key: ZITE_OUTLOOK_SEND_AS_EMAIL
        sync: false
      - key: ZITE_N8N_CALENDAR_WEBHOOK_URL
        sync: false
      - key: ZITE_N8N_TIMELINE_WEBHOOK_URL
        sync: false
      - key: ZITE_N8N_TEAMS_WEBHOOK_URL
        sync: false
      - key: STRICT_OUTPUT
        value: "true"
      # Render usa contenedores distintos para build y runtime: el default de
      # Puppeteer ($HOME/.cache/puppeteer, fuera del proyecto) se descarga en
      # el build pero no sobrevive al contenedor que sirve la app — Chrome
      # "desaparece" en producción aunque el build haya salido bien. Se fuerza
      # la descarga dentro de /opt/render/project/src (el propio checkout,
      # que sí persiste) para que build y runtime miren la misma carpeta.
      - key: PUPPETEER_CACHE_DIR
        value: /opt/render/project/src/.cache/puppeteer
      # NO agregar VITE_MOCK_USER aquí — si se define en true, se salta toda
      # la autenticación real (ver server/auth.ts). Debe quedar ausente.

  # Frontend Vite — build estático servido por el CDN de Render.
  - type: web
    name: hub-sapience-front
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # URL pública del backend de arriba + /api, p.ej. https://hub-sapience-api.onrender.com/api
      - key: VITE_API_URL
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      # NO agregar VITE_MOCK_USER aquí por la misma razón que arriba.
